                { id: 's4', text: 'ვიღებ', categoryId: 'action' },
                { id: 's5', text: 'რეგისტრატორი', categoryId: 'person' },
                { id: 's6', text: 'ვგრძნობ', categoryId: 'action' },

                { id: 's8', text: 'მტკივა', categoryId: 'action' }

        };

        // 6. MEMORY GAME DATA
        const MEMORY_DATA = [
            { id: 'mem1', content: 'ექიმი', pairId: 'p1' },
            { id: 'mem2', content: 'Doctor', pairId: 'p1' },
            { id: 'mem3', content: 'წამალი', pairId: 'p2' },
            { id: 'mem4', content: 'Medicine', pairId: 'p2' },
            { id: 'mem5', content: 'ვირუსი', pairId: 'p3' },
            { id: 'mem6', content: 'Virus', pairId: 'p3' },
            { id: 'mem7', content: 'ტკივილი', pairId: 'p4' },
            { id: 'mem8', content: 'Pain', pairId: 'p4' },
            { id: 'mem9', content: 'აცრა', pairId: 'p5' },
            { id: 'mem10', content: 'Vaccine', pairId: 'p5' },
            { id: 'mem11', content: 'წყალი', pairId: 'p6' },
            { id: 'mem12', content: 'Water', pairId: 'p6' }
        ];

        // --- COMPONENTS ---

        const Button = ({ children, variant = 'primary', fullWidth = false, className = '', ...props }) => {
            const baseStyles = "px-6 py-3 rounded-xl font-semibold transition-all duration-200 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2";
            const variants = {
                primary: "bg-teal-600 text-white hover:bg-teal-700 shadow-md hover:shadow-lg",

                success: "bg-green-600 text-white hover:bg-green-700"
            };
            return (
                <button className={`${baseStyles} ${variants[variant]} ${fullWidth ? 'w-full' : ''} ${className}`} {...props}>
                    {children}
                </button>
            );
        };

        // --- 1. GapFill Component ---
        const GapFill = () => {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [selectedOption, setSelectedOption] = useState(null);
            const [isCorrect, setIsCorrect] = useState(null);
            const [streak, setStreak] = useState(0);

            const data = GAP_FILL_DATA[currentIndex];

            const handleCheck = (option) => {
                if (isCorrect === true) return;
                setSelectedOption(option);
                if (option === data.answer) {
                    setIsCorrect(true);
                    setStreak(s => s + 1);
                } else {
                    setIsCorrect(false);
                    setStreak(0);
                }
            };

            const handleNext = () => {
                setIsCorrect(null);
                setSelectedOption(null);
                setCurrentIndex((prev) => (prev + 1) % GAP_FILL_DATA.length);
            };

            return (
                <div className="max-w-2xl mx-auto p-4 w-full h-full flex flex-col">
                     <div className="flex justify-between items-center mb-6">
                        <h2 className="text-xl font-bold text-slate-800">სიტყვების ჩასმა</h2>
                        <div className="bg-purple-100 text-purple-700 px-3 py-1 rounded-full font-bold text-sm shadow-sm">
                            #{currentIndex + 1} / {GAP_FILL_DATA.length}
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 flex-grow flex flex-col items-center justify-center">
                        <h3 className="text-xl md:text-2xl font-bold text-slate-700 mb-8 text-center leading-relaxed">
                            {data.sentence.split('______').map((part, i, arr) => (
                                <React.Fragment key={i}>
                                    {part}
                                    {i < arr.length - 1 && (
                                        <span className={`inline-block border-b-4 px-2 min-w-[80px] text-center transition-colors ${isCorrect === true ? 'border-green-500 text-green-600' : isCorrect === false ? 'border-red-500 text-red-600' : 'border-slate-300 text-slate-400'}`}>
                                            {isCorrect !== null ? (isCorrect ? data.answer : selectedOption) : "?"}
                                        </span>
                                    )}
                                </React.Fragment>
                            ))}
                        </h3>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 w-full mt-8">
                            {data.options.map((opt, idx) => {
                                let btnStyle = "bg-slate-50 border-slate-200 text-slate-700 hover:border-purple-400";
                                if (isCorrect === true && opt === data.answer) btnStyle = "bg-green-100 border-green-500 text-green-800";
                                else if (isCorrect === false && opt === selectedOption) btnStyle = "bg-red-100 border-red-500 text-red-800";
                                
                                return (
                                    <button 
                                        key={idx} 
                                        onClick={() => handleCheck(opt)}

                                        className={`p-4 rounded-xl border-2 font-semibold text-lg transition-all ${btnStyle}`}
                                    >
                                        {opt}
                                    </button>

                            })}

                        {isCorrect !== null && (
                            <div className={`mt-6 font-bold text-lg animate-fade-in ${isCorrect ? 'text-green-600' : 'text-red-500'}`}>

                            </div>
                        )}
                    </div>

                     {isCorrect === true && (
                        <div className="mt-6 animate-fade-in">
                            <Button onClick={handleNext} fullWidth variant="primary">შემდეგი &rarr;</Button>
                        </div>
                    )}
                </div>
            );
        };

        // --- 2. Matching Game Component ---
        const MatchingGame = () => {
            const [leftItems, setLeftItems] = useState([]);
            const [rightItems, setRightItems] = useState([]);
            const [selectedLeft, setSelectedLeft] = useState(null);
            const [matchedPairs, setMatchedPairs] = useState([]);

            useEffect(() => {
                // Initialize shuffle
                const shuffledRight = [...MATCHING_DATA].sort(() => Math.random() - 0.5);
                setLeftItems(MATCHING_DATA);
                setRightItems(shuffledRight);
            }, []);

            const handleLeftClick = (item) => {
                if (matchedPairs.includes(item.pairId)) return;
                setSelectedLeft(item);
            };

            const handleRightClick = (item) => {
                if (matchedPairs.includes(item.pairId) || !selectedLeft) return;
                
                if (selectedLeft.pairId === item.pairId) {
                    // Match found
                    setMatchedPairs([...matchedPairs, item.pairId]);
                    setSelectedLeft(null);
                } else {
                    // Wrong match
                    const btn = document.getElementById(`right-${item.id}`);
                    btn.classList.add('bg-red-100', 'border-red-500');
                    setTimeout(() => {
                         btn.classList.remove('bg-red-100', 'border-red-500');
                         setSelectedLeft(null);
                    }, 500);
                }
            };

            const isComplete = matchedPairs.length === MATCHING_DATA.length;

            return (
                <div className="max-w-4xl mx-auto p-4 w-full h-full flex flex-col">
                    <h2 className="text-xl font-bold text-slate-800 mb-6 flex justify-between">
                        <span>დააკავშირეთ სიტყვები</span>
                        <span className="text-teal-600">{matchedPairs.length} / {MATCHING_DATA.length}</span>
                    </h2>

                    <div className="flex gap-8 flex-1 overflow-y-auto">
                        {/* Left Column */}
                        <div className="flex-1 flex flex-col gap-3">
                            {leftItems.map(item => {
                                const isMatched = matchedPairs.includes(item.pairId);
                                const isSelected = selectedLeft?.id === item.id;
                                return (
                                    <button
                                        key={item.id}
                                        onClick={() => handleLeftClick(item)}
                                        disabled={isMatched}
                                        className={`p-4 rounded-xl border-2 text-left transition-all font-medium
                                            ${isMatched ? 'bg-green-50 border-green-500 text-green-700 opacity-50' : 
                                              isSelected ? 'bg-blue-50 border-blue-500 text-blue-700 scale-105' : 
                                              'bg-white border-slate-200 hover:border-blue-300'}`}
                                    >
                                        {item.left}
                                    </button>
                                );
                            })}
                        </div>

                        {/* Right Column */}
                        <div className="flex-1 flex flex-col gap-3">
                            {rightItems.map(item => {
                                const isMatched = matchedPairs.includes(item.pairId);
                                return (
                                    <button
                                        key={item.id}
                                        id={`right-${item.id}`}
                                        onClick={() => handleRightClick(item)}
                                        disabled={isMatched}
                                        className={`p-4 rounded-xl border-2 text-left transition-all font-medium
                                            ${isMatched ? 'bg-green-50 border-green-500 text-green-700 opacity-50' : 
                                              'bg-white border-slate-200 hover:border-blue-300'}`}
                                    >
                                        {item.right}
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                    
                    {isComplete && (
                        <div className="mt-6 p-4 bg-green-100 text-green-800 rounded-xl text-center font-bold animate-fade-in">
                            🎉 ყველა წყვილი ნაპოვნია!
                        </div>
                    )}
                </div>
            );
        };

        // --- 3. Sorting (Categorization) Game ---
        const SortingGame = () => {
            const [items, setItems] = useState([]);
            const [currentItem, setCurrentItem] = useState(null);
            const [score, setScore] = useState(0);
            const [feedback, setFeedback] = useState(null);

            useEffect(() => {
                const shuffled = [...SORTING_DATA.items].sort(() => Math.random() - 0.5);
                setItems(shuffled);
                setCurrentItem(shuffled[0]);
            }, []);

            const handleSort = (categoryId) => {
                if (feedback) return;

                if (currentItem.categoryId === categoryId) {
                    setFeedback('correct');
                    setScore(s => s + 1);
                    setTimeout(() => {
                        const nextItems = items.slice(1);
                        setItems(nextItems);
                        setCurrentItem(nextItems[0] || null);
                        setFeedback(null);
                    }, 800);
                } else {
                    setFeedback('wrong');
                    setTimeout(() => setFeedback(null), 800);
                }
            };

            if (!currentItem) {
                 return (
                    <div className="flex flex-col items-center justify-center h-full p-4">
                        <div className="text-4xl mb-4">🏆</div>
                        <h2 className="text-2xl font-bold text-slate-800 mb-2">დავალება შესრულებულია!</h2>
                        <p className="text-slate-600">თქვენ დაალაგეთ ყველა სიტყვა.</p>
                        <Button onClick={() => window.location.reload()} className="mt-6">თავიდან</Button>
                    </div>
                );
            }

            return (
                <div className="max-w-2xl mx-auto p-4 w-full h-full flex flex-col items-center">
                    <h2 className="text-xl font-bold text-slate-800 mb-8">დაახარისხეთ სიტყვები</h2>
                    
                    {/* Card to sort */}
                    <div className={`w-64 h-40 flex items-center justify-center bg-white rounded-2xl shadow-lg border-2 mb-12 transition-all duration-300 transform
                        ${feedback === 'correct' ? 'scale-0 opacity-0 border-green-500 bg-green-50' : feedback === 'wrong' ? 'animate-bounce-small border-red-500 bg-red-50' : 'border-slate-200'}`}>
                        <span className="text-2xl font-bold text-slate-800">{currentItem.text}</span>
                    </div>

                    {/* Bins */}
                    <div className="grid grid-cols-2 gap-6 w-full">
                        {SORTING_DATA.categories.map(cat => (
                            <button
                                key={cat.id}
                                onClick={() => handleSort(cat.id)}
                                className="h-32 rounded-2xl border-2 border-dashed border-slate-300 hover:border-teal-500 hover:bg-teal-50 bg-white/50 flex flex-col items-center justify-center gap-2 transition-all group"
                            >
                                <span className="text-3xl group-hover:scale-110 transition-transform">
                                    {cat.id === 'person' ? '👤' : '⚡'}
                                </span>
                                <span className="font-semibold text-slate-600 group-hover:text-teal-700">{cat.label}</span>
                            </button>
                        ))}
                    </div>
                    
                    <div className="mt-8 text-slate-400 font-medium">
                        დარჩენილია: {items.length}
                    </div>
                </div>
            );
        };

        // --- 4. Memory Game Component ---
        const MemoryGame = () => {
            const [cards, setCards] = useState([]);
            const [flipped, setFlipped] = useState([]);
            const [matched, setMatched] = useState([]);
            const [disabled, setDisabled] = useState(false);

            useEffect(() => {
                const shuffled = [...MEMORY_DATA].sort(() => Math.random() - 0.5);
                setCards(shuffled);
            }, []);

            const handleClick = (id) => {
                if (disabled || flipped.includes(id) || matched.includes(id)) return;

                if (flipped.length === 0) {
                    setFlipped([id]);
                    return;
                }

                if (flipped.length === 1) {
                    setDisabled(true);
                    setFlipped([...flipped, id]);
                    
                    const firstCard = cards.find(c => c.id === flipped[0]);
                    const secondCard = cards.find(c => c.id === id);

                    if (firstCard.pairId === secondCard.pairId) {
                        setMatched(prev => [...prev, firstCard.id, secondCard.id]);
                        setFlipped([]);
                        setDisabled(false);
                    } else {
                        setTimeout(() => {
                            setFlipped([]);
                            setDisabled(false);
                        }, 1000);
                    }
                }
            };

            return (
                <div className="max-w-3xl mx-auto p-4 w-full h-full flex flex-col">
                    <div className="flex justify-between items-center mb-4">
                        <h2 className="text-xl font-bold text-slate-800">მეხსიერების თამაში</h2>
                        <button onClick={() => { setMatched([]); setFlipped([]); setCards([...MEMORY_DATA].sort(() => Math.random() - 0.5)); }} className="text-sm text-teal-600 font-bold hover:underline">თავიდან</button>
                    </div>

                    <div className="grid grid-cols-3 sm:grid-cols-4 gap-3 flex-grow content-start">
                        {cards.map(card => {
                            const isFlipped = flipped.includes(card.id) || matched.includes(card.id);
                            const isMatched = matched.includes(card.id);
                            return (
                                <div 
                                    key={card.id} 
                                    className={`aspect-square cursor-pointer perspective-1000`}
                                    onClick={() => handleClick(card.id)}
                                >
                                    <div className={`relative w-full h-full transition-transform duration-500 transform-style-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
                                        <div className="absolute w-full h-full bg-teal-600 rounded-xl shadow-md flex items-center justify-center backface-hidden">
                                            <span className="text-2xl text-white/50">?</span>
                                        </div>
                                        <div className={`absolute w-full h-full ${isMatched ? 'bg-green-100 border-2 border-green-500' : 'bg-white border-2 border-teal-500'} rounded-xl shadow-md flex items-center justify-center backface-hidden rotate-y-180`}>
                                            <span className={`text-sm md:text-lg font-bold ${isMatched ? 'text-green-800' : 'text-slate-800'}`}>{card.content}</span>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // --- 5. Crossword Component (Mini) ---
        const CrosswordGame = () => {
             // Simple hardcoded crossword layout:
             //      ვ
             //      ი
             //      რ
             //      უ
             //      ს
             // ე ქ ი მ ი
             //      
             // Word 1 (Vertical): ვირუსი (VIRUSI) - at col 4, row 0-5
             // Word 2 (Horizontal): ექიმი (EKIMI) - at row 5, col 0-4. Intersect at 'I' (row 5, col 4)? No. 
             // Let's create a very simple independent grid for stability.
             
             const [inputs, setInputs] = useState({
                 w1_0:'', w1_1:'', w1_2:'', w1_3:'', w1_4:'', // ექიმი
                 w2_0:'', w2_1:'', w2_2:'', w2_3:'', w2_4:'', w2_5:'', // წამალი
             });
             
             const handleChange = (key, val) => {
                 setInputs(prev => ({...prev, [key]: val}));
             };

             const check = () => {
                 const w1 = Object.keys(inputs).filter(k => k.startsWith('w1')).map(k => inputs[k]).join('');
                 const w2 = Object.keys(inputs).filter(k => k.startsWith('w2')).map(k => inputs[k]).join('');
                 
                 let correct = 0;
                 if (w1 === 'ექიმი') correct++;
                 if (w2 === 'წამალი') correct++;
                 
                 if(correct === 2) alert("სწორია! ყოჩაღ!");
                 else alert("სცადეთ თავიდან.");
             };

             // Using a simpler "Word Construction" for Crossword feel without grid complexity in single file
             return (
                 <div className="max-w-xl mx-auto p-4 flex flex-col items-center">
                     <h2 className="text-xl font-bold text-slate-800 mb-6">მინი კროსვორდი</h2>
                     
                     <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 w-full">
                        <div className="mb-8">
                            <p className="font-bold text-slate-700 mb-2">1. ვინ მკურნალობს პაციენტს?</p>
                            <div className="flex gap-2">
                                {['w1_0','w1_1','w1_2','w1_3','w1_4'].map((key, i) => (
                                    <input key={key} maxLength={1} value={inputs[key]} onChange={(e) => handleChange(key, e.target.value)} className="w-10 h-10 border-2 border-slate-300 rounded text-center font-bold focus:border-teal-500 outline-none uppercase" />
                                ))}
                            </div>
                        </div>

                        <div className="mb-6">
                            <p className="font-bold text-slate-700 mb-2">2. რას ვსვამთ ავადმყოფობის დროს?</p>
                            <div className="flex gap-2">
                                {['w2_0','w2_1','w2_2','w2_3','w2_4','w2_5'].map((key, i) => (
                                    <input key={key} maxLength={1} value={inputs[key]} onChange={(e) => handleChange(key, e.target.value)} className="w-10 h-10 border-2 border-slate-300 rounded text-center font-bold focus:border-teal-500 outline-none uppercase" />
                                ))}
                            </div>
                        </div>

                        <Button onClick={check} fullWidth>შემოწმება</Button>
                     </div>
                 </div>
             );
        };

        // --- Legacy Quiz & Roleplay Components (Kept for variety) ---
        const Quiz = () => {
            const [currentQuestion, setCurrentQuestion] = useState(null);
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            const [showResult, setShowResult] = useState(false);
            const [streak, setStreak] = useState(0);
            const [usedQuestionIds, setUsedQuestionIds] = useState([]);

            const loadNewQuestion = () => {
                setShowResult(false);
                setSelectedAnswer(null);
                let availableQuestions = QUIZ_QUESTIONS.filter(q => !usedQuestionIds.includes(q.id));
                if (availableQuestions.length === 0) {
                    setUsedQuestionIds([]);
                    availableQuestions = QUIZ_QUESTIONS;
                }
                const randomIndex = Math.floor(Math.random() * availableQuestions.length);
                const nextQuestion = availableQuestions[randomIndex];
                setCurrentQuestion(nextQuestion);
                setUsedQuestionIds(prev => [...prev, nextQuestion.id]);
            };

            useEffect(() => { loadNewQuestion(); }, []);

            const handleAnswerSelect = (option) => {
                if (showResult || !currentQuestion) return;
                setSelectedAnswer(option);
                setShowResult(true);
                if (option === currentQuestion.correctAnswer) setStreak(s => s + 1);
                else setStreak(0);
            };

            if (!currentQuestion) return null;

            return (
                <div className="max-w-2xl mx-auto p-4 w-full h-full flex flex-col">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-xl font-bold text-slate-800">ქვიზი</h2>
                        <div className="bg-orange-100 text-orange-700 px-3 py-1 rounded-full font-bold text-sm shadow-sm">🔥 სერია: {streak}</div>
                    </div>
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6 flex-grow flex flex-col justify-center">
                        <h3 className="text-2xl font-bold text-slate-800 mb-8 text-center leading-relaxed">{currentQuestion.question}</h3>
                        <div className="grid grid-cols-1 gap-3">
                            {currentQuestion.options.map((option, idx) => {
                                let btnClass = "bg-slate-50 border-2 border-slate-200 text-slate-700 hover:border-teal-400";
                                if (showResult) {
                                    if (option === currentQuestion.correctAnswer) btnClass = "bg-green-100 border-2 border-green-500 text-green-800";
                                    else if (option === selectedAnswer) btnClass = "bg-red-100 border-2 border-red-500 text-red-800";
                                    else btnClass = "opacity-50 border-slate-100";
                                } else if (selectedAnswer === option) btnClass = "border-teal-500 bg-teal-50";
                                return <button key={idx} onClick={() => handleAnswerSelect(option)} disabled={showResult} className={`p-4 rounded-xl font-medium text-left transition-all ${btnClass}`}>{option}</button>;
                            })}
                        </div>
                        {showResult && (
                            <div className="mt-6 p-4 bg-blue-50 text-blue-900 rounded-xl animate-fade-in border border-blue-100">
                                <p className="font-bold mb-1 flex items-center gap-2">{selectedAnswer === currentQuestion.correctAnswer ? "✅ სწორია!" : "❌ არასწორია"}</p>
                                <p className="text-sm mt-1 text-blue-800">{currentQuestion.explanation}</p>
                            </div>
                        )}
                    </div>
                    <Button onClick={loadNewQuestion} disabled={!showResult} fullWidth variant={showResult ? 'primary' : 'secondary'}>შემდეგი შეკითხვა</Button>
                </div>
            );
        };

        const Roleplay = () => {
            const [messages, setMessages] = useState([]);
            const [currentNodeId, setCurrentNodeId] = useState('START');
            const messagesEndRef = useRef(null);
            const currentNode = DIALOGUE_SCENARIOS[currentNodeId];
            const isEnded = !currentNode || currentNode.options.length === 0;

            useEffect(() => {
                if (messages.length === 0 && currentNode) setMessages([{ id: 'init', role: 'model', text: currentNode.text }]);
            }, [messages.length, currentNode]);

            useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

            const handleOptionClick = (optionIndex) => {
                if (!currentNode) return;
                const option = currentNode.options[optionIndex];
                setMessages(prev => [...prev, { id: Date.now().toString(), role: 'user', text: option.text }]);
                
                if (option.feedback && !option.isCorrect) {
                    setTimeout(() => {
                        setMessages(prev => [...prev, { id: Date.now().toString(), role: 'model', text: `(მინიშნება: ${option.feedback})` }]);
                        if (option.nextId !== 'END' && DIALOGUE_SCENARIOS[option.nextId]) setCurrentNodeId(option.nextId);
                    }, 500);
                } else {
                    setCurrentNodeId(option.nextId);
                }
            };

            useEffect(() => {
                if (messages.length > 0 && currentNode) {
                    const lastMsg = messages[messages.length - 1];
                    if (lastMsg.role === 'user' || lastMsg.text.startsWith('(მინიშნება')) {
                        setTimeout(() => setMessages(prev => [...prev, { id: Date.now().toString(), role: 'model', text: currentNode.text }]), 600);
                    }
                }
            }, [currentNodeId, messages]);

            const resetDialogue = () => { setMessages([]); setCurrentNodeId('START'); };

            return (
                <div className="flex flex-col h-full max-w-3xl mx-auto w-full bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div className="bg-teal-600 p-4 text-white flex items-center justify-between">
                        <div className="flex items-center gap-3"><div className="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center text-xl">👨‍⚕️</div><div><h2 className="font-bold text-lg">ექიმთან ვიზიტი</h2><p className="text-teal-100 text-xs">სიმულაცია</p></div></div>
                        <button onClick={resetDialogue} className="text-xs bg-teal-700 hover:bg-teal-800 px-3 py-1 rounded-lg transition-colors">თავიდან</button>
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50">
                        {messages.map((msg, idx) => (
                            <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] p-3 rounded-2xl text-sm md:text-base ${msg.role === 'user' ? 'bg-teal-600 text-white rounded-br-none' : msg.text.startsWith('(მინიშნება') ? 'bg-orange-100 text-orange-800 border border-orange-200 text-xs italic' : 'bg-white text-slate-800 shadow-sm border border-slate-100 rounded-bl-none'}`}>{msg.text}</div>
                            </div>
                        ))}
                        <div ref={messagesEndRef} />
                    </div>
                    <div className="p-3 bg-white border-t border-slate-200">
                        {isEnded ? <Button fullWidth onClick={resetDialogue}>დასრულდა. თავიდან დაწყება</Button> : (
                            <div className="grid grid-cols-1 gap-2">
                                {currentNode?.options.map((opt, idx) => (
                                    <button key={idx} onClick={() => handleOptionClick(idx)} className="w-full text-left p-3 rounded-xl border-2 border-slate-100 hover:border-teal-500 hover:bg-teal-50 transition-all text-slate-700 font-medium text-sm md:text-base">{opt.text}</button>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [currentView, setCurrentView] = useState('HOME');

            const renderContent = () => {
                switch (currentView) {
                    case 'GAP_FILL': return <GapFill />;
                    case 'MATCHING': return <MatchingGame />;
                    case 'SORTING': return <SortingGame />;
                    case 'MEMORY': return <MemoryGame />;
                    case 'CROSSWORD': return <CrosswordGame />;
                    case 'QUIZ': return <Quiz />;
                    case 'ROLEPLAY': return <Roleplay />;
                    default: return (
                        <div className="flex flex-col items-center justify-center h-full max-w-4xl mx-auto p-6 text-center space-y-8 animate-fade-in">
                            <div className="mb-4"><h1 className="text-4xl md:text-6xl font-bold text-teal-800 mb-4 tracking-tight">GeoMed Learn</h1><p className="text-slate-600 text-lg md:text-xl max-w-2xl">სამედიცინო ლექსიკის პრაქტიკული სავარჯიშოები</p></div>
                            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 w-full">
                                <button onClick={() => setCurrentView('GAP_FILL')} className="bg-white p-4 rounded-xl shadow-sm hover:shadow-lg transition border hover:border-purple-400 flex flex-col items-center gap-2"><div className="text-3xl">✏️</div><span className="font-bold text-slate-700">ჩასმა</span></button>
                                <button onClick={() => setCurrentView('MATCHING')} className="bg-white p-4 rounded-xl shadow-sm hover:shadow-lg transition border hover:border-blue-400 flex flex-col items-center gap-2"><div className="text-3xl">🔗</div><span className="font-bold text-slate-700">დაკავშირება</span></button>
                                <button onClick={() => setCurrentView('SORTING')} className="bg-white p-4 rounded-xl shadow-sm hover:shadow-lg transition border hover:border-green-400 flex flex-col items-center gap-2"><div className="text-3xl">📂</div><span className="font-bold text-slate-700">სორტირება</span></button>
                                <button onClick={() => setCurrentView('MEMORY')} className="bg-white p-4 rounded-xl shadow-sm hover:shadow-lg transition border hover:border-pink-400 flex flex-col items-center gap-2"><div className="text-3xl">🃏</div><span className="font-bold text-slate-700">მეხსიერება</span></button>
                                <button onClick={() => setCurrentView('CROSSWORD')} className="bg-white p-4 rounded-xl shadow-sm hover:shadow-lg transition border hover:border-indigo-400 flex flex-col items-center gap-2"><div className="text-3xl">▦</div><span className="font-bold text-slate-700">კროსვორდი</span></button>
                                <button onClick={() => setCurrentView('QUIZ')} className="bg-white p-4 rounded-xl shadow-sm hover:shadow-lg transition border hover:border-orange-400 flex flex-col items-center gap-2"><div className="text-3xl">🧠</div><span className="font-bold text-slate-700">ქვიზი</span></button>
                                <button onClick={() => setCurrentView('ROLEPLAY')} className="col-span-2 bg-white p-4 rounded-xl shadow-sm hover:shadow-lg transition border hover:border-teal-400 flex flex-col items-center gap-2"><div className="text-3xl">💬</div><span className="font-bold text-slate-700">დიალოგი ექიმთან</span></button>
                            </div>
                        </div>
                    );
                }
            };

            return (
                <div className="h-screen flex flex-col bg-slate-50 overflow-hidden">
                    <nav className="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm z-10 shrink-0">
                        <div className="flex items-center gap-2 cursor-pointer" onClick={() => setCurrentView('HOME')}><div className="w-8 h-8 bg-teal-600 rounded-lg flex items-center justify-center text-white font-bold shadow-md">G</div><span className="font-bold text-slate-800 text-lg hidden sm:block">GeoMed Learn</span></div>
                        {currentView !== 'HOME' && <button onClick={() => setCurrentView('HOME')} className="text-slate-500 hover:text-teal-600 font-medium text-sm flex items-center gap-1 transition-colors px-3 py-1 rounded-lg hover:bg-slate-50">← მთავარი</button>}
                    </nav>
                    <main className="flex-1 overflow-y-auto p-4 md:p-8">{renderContent()}</main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
